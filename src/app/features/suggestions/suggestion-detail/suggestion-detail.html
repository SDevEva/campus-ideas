<div class="container mt-5">
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h2>Détails de la suggestion</h2>
    
    <div *ngIf="suggestion">
      <h3 class="mt-3">{{ suggestion.title }}</h3>
      <span class="badge bg-primary mb-3">{{ suggestion.category }}</span>
      <p class="fs-5">{{ suggestion.description }}</p>
      <p class="text-muted">Date: {{ suggestion.date | date }}</p>
      <p><strong>Statut:</strong> {{ suggestion.status }}</p>
      <p><strong>Likes:</strong> {{ suggestion.nbLikes }}</p>
    </div>

    <div *ngIf="!suggestion">
      <p class="fs-5 text-muted mt-3">Suggestion introuvable pour l'ID : <strong>{{ suggestionId }}</strong></p>
    </div>
    
    <div class="mt-4">
      <a routerLink="/suggestions" class="btn btn-secondary px-4 py-2 rounded-3 shadow-none fw-bold">
        <i class="bi bi-arrow-left"></i> Back to list
      </a>
    </div>
  </div>
</div>
