<div class="container mt-5">
  <div class="card shadow-sm border-0 bg-light p-4">
    <h2 class="mb-4">Rendu final</h2>
    
    <form [formGroup]="suggestionForm" (ngSubmit)="onSubmit()">
      
      <!-- Titre -->
      <div class="mb-3">
        <label for="title" class="form-label">Titre :</label>
        <input type="text" id="title" class="form-control" formControlName="title" placeholder="" />
        <div *ngIf="f['title'].invalid && (f['title'].dirty || f['title'].touched)" class="text-danger mt-1 small">
          <div *ngIf="f['title'].errors?.['required']">Le titre est obligatoire.</div>
          <div *ngIf="f['title'].errors?.['minlength']">Le titre doit contenir au minimum 5 caractères.</div>
          <div *ngIf="f['title'].errors?.['pattern']">Le titre ne doit contenir que des lettres et commencer par une majuscule.</div>
        </div>
      </div>
      
      <!-- Description -->
      <div class="mb-3">
        <label for="description" class="form-label">Description :</label>
        <textarea id="description" class="form-control" rows="3" formControlName="description"></textarea>
        <div *ngIf="f['description'].invalid && (f['description'].dirty || f['description'].touched)" class="text-danger mt-1 small">
          <div *ngIf="f['description'].errors?.['required']">La description est obligatoire.</div>
          <div *ngIf="f['description'].errors?.['minlength']">La description doit contenir au minimum 30 caractères.</div>
        </div>
      </div>
      
      <!-- Catégorie -->
      <div class="mb-3">
        <label for="category" class="form-label">Catégorie :</label>
        <select id="category" class="form-select" formControlName="category">
          <option value="" disabled selected>-- Sélectionnez une catégorie --</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
        <div *ngIf="f['category'].invalid && (f['category'].dirty || f['category'].touched)" class="text-danger mt-1 small">
          <div *ngIf="f['category'].errors?.['required']">La catégorie est obligatoire.</div>
        </div>
      </div>
      
      <!-- Date -->
      <div class="mb-3">
        <label for="date" class="form-label">Date :</label>
        <input type="text" id="date" class="form-control" formControlName="date" readonly />
      </div>
      
      <!-- Status -->
      <div class="mb-4">
        <label for="status" class="form-label">Status :</label>
        <input type="text" id="status" class="form-control" formControlName="status" readonly />
      </div>
      
      <!-- Submit button -->
      <button type="submit" class="btn btn-primary px-4 py-2" [disabled]="suggestionForm.invalid">
        Soumettre
      </button>
      
    </form>
  </div>
</div>
